version: 2.1
orbs:
  gh-app: wmfs/github-app-token@1.0.0
jobs:
  unit-test:
    docker:
      - image: cimg/node:lts
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          TZ: "Europe/London"
          PG_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/circle_test
          TIMEOUT: 15000
      - image: cimg/postgres:15.2-postgis
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: circle_test
          TZ: "Europe/London"
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: install
          command: npm install
      - save_cache:
          key: v1-deps-{{ checksum "package.json" }}
          paths:
            - node_modules
      - run:
          name: test
          command: npm test
  lint:
    docker:
      - image: cimg/node:lts
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: install standard
          command: npm install standard
      - run:
          name: lint
          command: npm run lint
  release:
    docker:
      - image: cimg/node:lts
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          TZ: "Europe/London"
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: install
          command: npm install
      - save_cache:
          key: v1-deps-{{ checksum "package.json" }}
          paths:
            - node_modules
      - gh-app/mint
      - run:
          name: release
          command: npx semantic-release
workflows:
  test_and_release:
    jobs:
      - unit-test:
          context:
            - docker-hub-creds
            - build-env-vars
      - lint:
          context:
            - docker-hub-creds
      - release:
          context:
            - docker-hub-creds
            - build-env-vars
            - github-app
          requires:
            - unit-test
            - lint
          filters:
            branches:
              only: master
